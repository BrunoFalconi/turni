<!-- 
AGGIUNGERE QUESTI MIGLIORAMENTI ALL'HEAD di index.html
Nota: i tag già presenti nel progetto verranno mantenuti,
questo file mostra cosa aggiungere
-->

<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Meta basic (MANTENERE) -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  
  <!-- 🆕 Meta descrizione per SEO -->
  <meta name="description" content="App modulare per la gestione dei turni di lavoro, calcolo automatico dei stipendi e analisi cedolini. Funziona completamente offline.">
  
  <!-- 🆕 Theme color (MIGLIORATO - aggiungi media query) -->
  <meta name="theme-color" content="#0e1420" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a2332" media="(prefers-color-scheme: dark)">
  
  <!-- Meta PWA (MANTENERE) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turni">
  
  <!-- 🆕 Supporto notch/safe area -->
  <meta name="viewport" content="viewport-fit=cover">
  
  <!-- Manifest (MANTENERE) -->
  <link rel="manifest" href="./manifest.webmanifest">
  
  <!-- 🆕 Aggiungi manifest alternative per iOS -->
  <link rel="apple-touch-startup-image" href="./icon-192.png">
  
  <!-- Icons (MANTENERE) -->
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="shortcut icon" href="./icon-192.png">
  
  <!-- 🆕 Open Graph - Social media sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="TurniApp - Gestione Turni e Stipendi">
  <meta property="og:description" content="App per la gestione dei turni di lavoro, calcolo automatico dei stipendi e analisi cedolini. Funziona completamente offline.">
  <meta property="og:image" content="./icon-512.png">
  <meta property="og:url" content="https://github.com/Kumatetsu78/turni">
  <meta property="og:site_name" content="TurniApp">
  
  <!-- 🆕 Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TurniApp - Gestione Turni">
  <meta name="twitter:description" content="Gestisci turni e stipendi offline">
  <meta name="twitter:image" content="./icon-192.png">
  
  <!-- 🆕 Canonical -->
  <link rel="canonical" href="https://github.com/Kumatetsu78/turni">
  
  <!-- CSS (MANTENERE) -->
  <link rel="stylesheet" href="./css/style.css">
  
  <!-- 🆕 Preload critical resources -->
  <link rel="preload" as="script" href="./js/core.js">
  <link rel="preload" as="script" href="./js/app.js">
  
  <!-- 🆕 Prefetch CDN dependencies -->
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  
  <!-- 🆕 Web app meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="full-screen" content="yes">
  <meta name="screen-orientation" content="portrait">
  
  <!-- 🆕 Installability hints -->
  <link rel="manifest" href="./manifest.webmanifest">
  
  <title>Turni - Gestione Turni e Stipendi</title>
  
  <!-- 🆕 Loading style inline (evita flash) -->
  <style>
    body { 
      background-color: #0e1420;
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- 🆕 Noscript fallback -->
  <noscript>
    <div style="padding:20px;text-align:center;color:#ff6b6b;">
      TurniApp richiede JavaScript abilitato. <a href="https://enable-javascript.com/" style="color:#4dabf7;">Come abilitare JavaScript</a>
    </div>
  </noscript>
  
  <!-- ... rest of body ... -->

  <!-- 🆕 IMPORTANTE: Carica logger PRIMA degli altri script -->
  <script src="./js/logger.js"></script>
  
  <!-- CDN con SRI (Subresource Integrity) - MIGLIORATO -->
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
    integrity="sha512-Z98ZTMdtVZ/pVn+Ryo+VWFNC0Z8FD/HvD6kLLcKCRxyPQDKV0F3SNCk/V6YlvVy5nqx0d5z+4x9f6qPW3Rq0g=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    onerror="window.xlsxLoaded=false;console.warn('XLSX CDN fallito, usando versione locale');"></script>
  
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
    integrity="sha512-..."
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    onerror="window.pdfLoaded=false;console.warn('PDF.js CDN fallito, usando versione locale');"></script>

  <!-- Fallback scripts se i CDN non caricano -->
  <script>
    // Fallback XLSX
    if (typeof XLSX === 'undefined') {
      const script = document.createElement('script');
      script.src = './lib/xlsx.full.min.js';
      script.onerror = () => {
        console.error('XLSX non disponibile!');
        Logger.error('XLSX library not loaded', { attempt: 'local fallback' });
      };
      document.head.appendChild(script);
    }
    
    // Fallback PDF.js
    if (typeof pdfjsLib === 'undefined') {
      const script = document.createElement('script');
      script.src = './lib/pdf.min.js';
      script.onerror = () => {
        console.error('PDF.js non disponibile!');
        Logger.error('PDF.js library not loaded', { attempt: 'local fallback' });
      };
      document.head.appendChild(script);
    }
  </script>

  <!-- Core scripts (MANTENERE) -->
  <script src="./js/core.js"></script>
  <script src="./js/excel.js"></script>
  <script src="./js/backup.js"></script>
  <script src="./js/stats.js"></script>
  <script src="./js/payslip.js"></script>
  <script src="./js/app.js"></script>
  
  <!-- 🆕 Error boundary per monitorare errori globali -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Logger.info('App loaded successfully', { 
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent
      });
    });
    
    window.addEventListener('error', (event) => {
      Logger.error('Global error', {
        message: event.message,
        file: event.filename,
        line: event.lineno,
        col: event.colno
      });
    });
    
    window.addEventListener('unhandledrejection', (event) => {
      Logger.error('Unhandled promise rejection', {
        reason: String(event.reason)
      });
    });
  </script>
</body>
</html>
